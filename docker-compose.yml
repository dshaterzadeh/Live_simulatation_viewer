# The whole prototype in one stack: two brokers, the HELICS engine + bridge
# federates, the sensor simulator, and the static/proxy server for the
# dashboard. Driven by ./run.sh.
#
# Configuration lives in .env (copy .env.example) and nowhere else:
#   - every service gets it verbatim through `env_file`, and the Python entry
#     points read it via config.py, so no service takes flags here;
#   - the `${VAR:?}` references below are the few values Compose itself needs
#     (port mappings, health checks, the Mosquitto listeners) and fail loudly
#     when the variable is missing rather than defaulting;
#   - the only per-service `environment:` overrides are the three addresses
#     that must point at a container instead of the host.
#
# The HELICS federation (engine + bridge) is static: it forms with exactly two
# federates and cannot be joined late. helics-broker outlives federations — it
# recycles itself when one ends. engine and bridge restart `on-failure` only:
# a bounded LOOP=0 pass that finishes cleanly stays finished, while a crash of
# either makes the other exit too (HELICS lost-comms, ~10 s) and both restart.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto-broker
    ports:
      - "${MQTT_PORT:?see .env.example}:${MQTT_PORT:?}"        # MQTT over TCP  — bridge, sensors, mosquitto_pub/sub
      - "${MQTT_WS_PORT:?see .env.example}:${MQTT_WS_PORT:?}"  # MQTT over WebSockets — the browser dashboard
    # The listener config is written from .env at start-up so the ports are
    # declared once, not here and again in a mosquitto.conf.
    command: >
      sh -c "printf 'listener ${MQTT_PORT:?}\nprotocol mqtt\nallow_anonymous true\n\nlistener ${MQTT_WS_PORT:?}\nprotocol websockets\nallow_anonymous true\n'
      > /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf"
    healthcheck:
      # The bridge and sensors only start once the broker actually accepts
      # connections.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "${MQTT_PORT:?}", "-t", "$$SYS/#", "-C", "1", "-W", "2"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  helics-broker:
    build: .
    image: hdf5-publisher
    container_name: helics-broker
    entrypoint: ["python3", "helics_broker.py"]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
    # The broker is also the run controller (play/pause/step/pace over MQTT),
    # so it wants Mosquitto — but it serves the federation without it too.
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      # The broker writes the sentinel from its own helicsBrokerIsConnected();
      # the socket probe confirms the port is really accepting. A throwaway
      # federate would be the literal test, but with a fixed federate count it
      # would join — and break — the real federation.
      test: ["CMD", "python3", "-c", "import os,socket,sys; sys.exit(0 if os.path.exists('/tmp/helics-broker.ready') and socket.create_connection(('127.0.0.1', ${HELICS_BROKER_PORT:?see .env.example}), timeout=1) else 1)"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  engine:
    image: hdf5-publisher
    container_name: hdf5-engine
    env_file: .env
    environment:
      HELICS_BROKER_HOST: helics-broker
    # The data file is mounted, not baked into the image: HDF5_FILE names it in
    # exactly one place.
    volumes:
      - ./${HDF5_FILE:?see .env.example}:/app/${HDF5_FILE:?}:ro
    depends_on:
      helics-broker:
        condition: service_healthy
    # Looping is the point: telemetry is QoS 0 and unretained, so an engine that
    # exits after one pass leaves the dashboard with nothing arriving. LOOP=0
    # gives a bounded one-shot run instead (the whole federation then exits).
    restart: on-failure

  bridge:
    image: hdf5-publisher
    container_name: hdf5-bridge
    entrypoint: ["python3", "bridge.py"]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      HELICS_BROKER_HOST: helics-broker
    depends_on:
      helics-broker:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: on-failure

  sensors:
    image: hdf5-publisher
    container_name: hdf5-sensors
    entrypoint: ["python3", "sensor_simulator.py"]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
    volumes:
      - ./${HDF5_FILE:?}:/app/${HDF5_FILE:?}:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      helics-broker:
        condition: service_started   # shares the image; ensures it has been built
    restart: unless-stopped

  frontend:
    image: python:3.11-slim
    container_name: hdf5-frontend
    working_dir: /app
    # Bind-mounted, not baked in: edit the HTML and reload the browser.
    volumes:
      - ./local_server.py:/app/local_server.py:ro
      - ./config.py:/app/config.py:ro
      - ./mqtt_web_tester.html:/app/mqtt_web_tester.html:ro
    env_file: .env
    environment:
      # Inside the container it must listen on all interfaces; the port mapping
      # below is what keeps the /proxy/ endpoint off the network.
      FRONTEND_BIND: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?see .env.example}:${FRONTEND_PORT:?}"
    command: ["python3", "local_server.py"]
    restart: unless-stopped
